<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Track Not Found | BeatDrop Lakehouse</title>
    <meta name="description" content="404 Error: The requested track or partition could not be found in the BeatDrop Big Data Music Lakehouse.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6.0">
    <style>
        .error-page-wrapper {
            min-height: 100vh;
            background: var(--color-yellow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .error-card {
            background: var(--color-white);
            border: 5px solid var(--color-black);
            box-shadow: 10px 10px 0 var(--color-black);
            max-width: 650px;
            width: 100%;
            padding: 48px 36px;
            box-sizing: border-box;
        }
        .error-code {
            font-size: clamp(72px, 12vw, 120px);
            font-weight: 900;
            line-height: 0.9;
            color: var(--color-black);
            margin-bottom: 12px;
            letter-spacing: -3px;
        }
        .error-badge {
            display: inline-block;
            background: var(--color-pink);
            color: var(--color-white);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 13px;
            padding: 6px 16px;
            border: 3px solid var(--color-black);
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .error-msg {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 32px;
            color: var(--color-black);
        }
        .btn-home {
            display: inline-block;
            background: var(--color-yellow);
            color: var(--color-black);
            border: 4px solid var(--color-black);
            box-shadow: 5px 5px 0 var(--color-black);
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 15px;
            padding: 14px 28px;
            text-transform: uppercase;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-home:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0 var(--color-black);
        }
    </style>
</head>
<body>
    <div class="error-page-wrapper">
        <div class="error-card">
            <div class="error-code">404</div>
            <div class="error-badge">⚠️ PARTITION OR TRACK NOT FOUND</div>
            <p class="error-msg">The URL you requested was either routed to the quarantine audit or does not exist in the 5-layer lakehouse.</p>
            <a href="/" class="btn-home">&larr; Return to BeatDrop Lakehouse</a>
        </div>
    </div>
</body>
</html>
