<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background Yellow -->
  <rect width="1200" height="630" fill="#FFD600"/>
  
  <!-- Subtle brutalist grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Thick Outer Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#0A0A0A" stroke-width="8"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="60" y="60" width="380" height="46" fill="#0A0A0A"/>
  <text x="80" y="90" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="2">⚡ BEAT DROP • 5,060 TRACKS</text>

  <!-- Big Brand Title -->
  <text x="60" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="#0A0A0A" letter-spacing="-3">BEAT DROP</text>
  <text x="60" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#0A0A0A" letter-spacing="-2">BIG DATA MUSIC LAKE</text>

  <!-- Stat Pills -->
  <g transform="translate(60, 340)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/>
    <rect x="8" y="8" width="260" height="60" fill="#0A0A0A" opacity="0.15"/>
    <text x="20" y="40" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#0A0A0A">5,060 TRACKS</text>

    <!-- Pill 2 -->
    <rect x="290" y="0" width="280" height="60" fill="#FF6B00" stroke="#0A0A0A" stroke-width="4"/>
    <text x="310" y="40" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#FFFFFF">98.81% QUALITY</text>

    <!-- Pill 3 -->
    <rect x="600" y="0" width="300" height="60" fill="#00C853" stroke="#0A0A0A" stroke-width="4"/>
    <text x="620" y="40" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#0A0A0A">5 LAKE LAYERS</text>
  </g>

  <!-- Engine Badges at Bottom -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="1080" height="60" fill="#0A0A0A"/>
    <text x="30" y="38" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#FFD600" letter-spacing="1">HADOOP 3.5.0 • APACHE SPARK 3.5.3 • HIVE 4.0.0 • APACHE PIG • GROQ AI</text>
  </g>
</svg>
